include: package:flutter_lints/flutter.yaml

analyzer:
  # الوضع الصارم — بيمسك أخطاء الأنواع اللي بتعدي في الإعداد الافتراضي
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # الكود المولّد من الـ arb مش بتاعنا
    invalid_annotation_target: ignore
    # نسيان await على Future مصدر شائع لباجات صعبة
    unawaited_futures: error
    # لازم كل TODO يبقى مقصود
    todo: info

  exclude:
    - lib/l10n/app_localizations*.dart
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # أمان وصحة
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - only_throw_errors
    - throw_in_finally
    - unawaited_futures
    - use_build_context_synchronously

    # وضوح
    - avoid_redundant_argument_values
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_child_properties_last
    - unnecessary_parenthesis
    - use_named_constants

    # منع الأخطاء الشائعة في Flutter
    - avoid_print
    - use_colored_box
    - use_decorated_box
